---
- name: Destroy RKE2 cluster
  hosts: k8s_nodes
  become: true

  vars:
    ansible_host: "{{ node_private_ip }}"
    ansible_user: "{{ ssh_user }}"

  tasks:
    - name: Uninstall RKE2
      ansible.builtin.include_role:
        name: rke2
      vars:
        rke2_action: uninstall

    - name: Restart WireGuard interface
      ansible.builtin.systemd_service:
        name: "wg-quick@{{ wireguard_interface }}"
        state: restarted
        enabled: true
        daemon_reload: true
