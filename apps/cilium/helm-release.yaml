apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: cilium-system
spec:
  serviceAccountName: cluster-reconciler
  interval: 1h
  timeout: 5m

  chart:
    spec:
      chart: cilium
      version: "1.20.0"
      sourceRef:
        kind: HelmRepository
        name: cilium
  valuesFrom:
    - kind: ConfigMap
      name: cilium-values
      valuesKey: values.yaml
