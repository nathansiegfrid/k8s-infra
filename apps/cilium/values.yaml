# Enable host firewall.
# https://docs.cilium.io/en/latest/security/host-firewall/
# https://docs.cilium.io/en/latest/security/policy/host/#hostpolicies
hostFirewall:
  enabled: true

# === ISTIO SUPPORT ===

# Allow Istio's CNI plugin to chain with Cilium.
cni:
  exclusive: false
# Restrict eBPF socket load balancing to the host namespace so it does not
# bypass Istio's sidecar or ztunnel proxies.
socketLB:
  enabled: true
  hostNamespaceOnly: true

# Disable unused components.
envoy:
  enabled: false
hubble:
  enabled: false
l7Proxy: false

# === GATEWAY API SUPPORT ===

# Enable Gateway API (requires kubeProxyReplacement=true and l7Proxy=true).
# gatewayAPI:
#   enabled: true
#   # Use host network instead of LoadBalancer service.
#   hostNetwork:
#     enabled: true

# Allow Gateway API listeners to bind to privileged ports when using host network mode.
# https://docs.cilium.io/en/latest/network/servicemesh/gateway-api/host-network-mode/#bind-to-privileged-port
# envoy:
#   enabled: true
#   securityContext:
#     capabilities:
#       keepCapNetBindService: true
#       envoy:
#         - NET_BIND_SERVICE # Allow Envoy to bind to privileged ports (<= 1023).
#         - NET_ADMIN
#         # Both PERFMON and BPF requires kernel 5.8, container runtime
#         # cri-o >= v1.22.0 or containerd >= v1.5.0.
#         - PERFMON
#         - BPF

# === REQUIRED CONFIGURATION VALUES ===
# The values below are minimal working configuration defined on initial cluster setup.
# Do not change.

# Override the destination namespace for Cilium resources.
namespaceOverride: cilium-system

# Enable kube-proxy replacement mode.
# Required because kube-proxy is not deployed on this cluster.
kubeProxyReplacement: true
k8sServiceHost: localhost
k8sServicePort: "6443"

# Cilium Operator must run on control-plane nodes to reach localhost:6443.
operator:
  nodeSelector:
    node-role.kubernetes.io/control-plane: "true"

# Delegate pod IP allocation to Kubernetes.
# Pod subnets are assigned by the Kubernetes API server instead of Cilium.
# Prevents Cilium's default 10.0.0.0/8 pool from overlapping with the nodes' private IP.
ipam:
  mode: kubernetes
