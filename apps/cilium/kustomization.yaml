apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cilium-system

resources:
  - helm-release.yaml
  - helm-repository.yaml

configMapGenerator:
  - name: cilium-values
    namespace: cilium-system
    files:
      - values.yaml
generatorOptions:
  disableNameSuffixHash: true
