apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-operator
  namespace: flux-system
spec:
  serviceAccountName: helm-controller
  interval: 1h
  timeout: 5m

  chart:
    spec:
      chart: flux-operator
      version: 0.55.0
      sourceRef:
        kind: HelmRepository
        name: flux-operator
  install:
    createNamespace: true
  values:
    multitenancy:
      enabled: true
