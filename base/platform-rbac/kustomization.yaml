apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Override via Flux's Kustomization
namespace: default

resources:
  - namespace.yaml
  - rbac.yaml

replacements:
  - source:
      kind: Namespace
      fieldPath: metadata.name
    targets:
      # Dynamically set ClusterRoleBinding subject namespace
      - select:
          kind: ClusterRoleBinding
          name: cluster-reconciler
        fieldPaths:
          - subjects.[name=cluster-reconciler].namespace
      # Dynamically set ClusterRoleBinding name to "cluster-reconciler-${namespace}"
      - select:
          kind: ClusterRoleBinding
          name: cluster-reconciler
        fieldPaths:
          - metadata.name
        options:
          delimiter: "-"
          index: 2
