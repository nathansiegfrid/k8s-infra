# kustomization `replacements` block rewrites it using the actual Namespace
# resource name defined in namespace.yaml.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: cluster-reconciler
  namespace: _

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-reconciler
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
subjects:
  - kind: ServiceAccount
    name: cluster-reconciler
    namespace: _
