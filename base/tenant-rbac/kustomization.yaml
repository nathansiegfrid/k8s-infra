apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Override via Flux's Kustomization
namespace: default

resources:
  - namespace.yaml
  - rbac.yaml

replacements:
  - source:
      kind: Namespace
      fieldPath: metadata.name
    targets:
      # Dynamically set RoleBinding subject namespace
      - select:
          kind: RoleBinding
          name: tenant-reconciler
        fieldPaths:
          - subjects.[name=tenant-reconciler].namespace
