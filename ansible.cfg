[defaults]
inventory = inventory/
inventory_ignore_patterns = ^.+\.example$
interpreter_python = auto_silent
# Decrypt group_vars/*/*.sops.yaml with your age key. SOPS finds the key at
# SOPS_AGE_KEY_FILE, or sops/age/keys.txt in your user config directory.
vars_plugins_enabled = host_group_vars,community.sops.sops

[ssh_connection]
pipelining = true
# Accept a new host's key; refuse a changed one.
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
