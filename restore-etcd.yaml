---
# Restore etcd from an S3 snapshot.
#
# This playbook only targets the first master node.
# Worker nodes are left untouched and will reconnect to the restored cluster
# automatically once the API server is back up.
# The rest of the master nodes should join normally as fresh new nodes later.

- name: Restore etcd from S3
  hosts: k8s_master_nodes[0]
  become: true

  vars:
    ansible_host: "{{ node_private_ip }}"
    ansible_user: "{{ ssh_user }}"

  tasks:
    - name: Restore etcd from S3
      ansible.builtin.include_role:
        name: rke2
      vars:
        rke2_action: etcd_restore
