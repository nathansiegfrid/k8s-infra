---
# Secure every host and build the WireGuard mesh. Safe to re-run.
#
# When it finishes, import any new client config from generated/, and check
# that this machine reaches every node over WireGuard.

- name: Work out how to reach each host
  hosts: all
  gather_facts: false
  roles:
    - connection

- name: Secure SSH access
  hosts: all
  become: true
  roles:
    - admin_user
    - ssh_hardening

# Each node's config needs every other node's public key, so one node
# failing stops them all, at that node's own error.
- name: Build the WireGuard mesh
  hosts: k8s_nodes
  become: true
  any_errors_fatal: true
  roles:
    - wireguard

- name: Check this machine is on the mesh
  hosts: k8s_nodes
  gather_facts: false
  tasks:
    - name: Check each node over WireGuard
      ansible.builtin.import_role:
        name: connection
        tasks_from: mesh
      vars:
        connection_mesh_required: false

    - name: Say what to do next
      ansible.builtin.debug:
        msg: >-
          {{ 'Not reachable over WireGuard from this machine: ' ~ connection_off_mesh | join(', ')
             ~ '. Import the client config from generated/, then check the connection.'
             if connection_off_mesh
             else 'This machine reaches every node over WireGuard.' }}
      run_once: true # noqa: run-once[task]
