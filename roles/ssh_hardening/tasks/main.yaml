---
# Fail2Ban against brute-force attempts; no root login, keys only.

- name: Install Fail2Ban
  ansible.builtin.apt:
    name:
      - python3-systemd # Fail2Ban's systemd backend
      - fail2ban
    state: present
    update_cache: true

- name: Write Fail2Ban SSH jail config
  ansible.builtin.copy:
    src: fail2ban-ssh.local
    dest: /etc/fail2ban/jail.d/ssh.local
    owner: root
    group: root
    mode: "0644"
  notify: Restart Fail2Ban

- name: Enable and start Fail2Ban
  ansible.builtin.systemd_service:
    name: fail2ban
    state: started
    enabled: true

# sshd keeps the first value it reads for each setting, and reads the
# drop-ins in name order. 00- loads before a provider's own drop-ins, such
# as cloud-init's 50-cloud-init.conf with `PasswordAuthentication yes`.
- name: Harden SSH daemon configuration
  ansible.builtin.template:
    src: sshd-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    owner: root
    group: root
    mode: "0600"
  notify: Restart SSH

# Fix warning when starting SSH from macOS terminals.
# -bash: warning: setlocale: LC_CTYPE: cannot change locale (UTF-8): No such file or directory
- name: Disable AcceptEnv in main sshd_config
  ansible.builtin.replace:
    path: /etc/ssh/sshd_config
    regexp: '^(AcceptEnv\s+.*)$'
    replace: '#\1'
  notify: Restart SSH

# `sshd -T` prints the settings sshd will use, from every file it reads. It
# also fails on a broken config, before the handler restarts SSH with it.
- name: Read the effective SSH settings
  ansible.builtin.command:
    cmd: /usr/sbin/sshd -T
  register: ssh_hardening_effective
  changed_when: false

- name: Assert root and password login are off
  ansible.builtin.assert:
    that:
      - "'permitrootlogin no' in ssh_hardening_effective.stdout_lines"
      - "'passwordauthentication no' in ssh_hardening_effective.stdout_lines"
    fail_msg: >-
      sshd still allows root or password login. Another file in
      /etc/ssh/sshd_config.d/ sorts before 00-hardening.conf, or sshd_config
      sets it before the Include line.
    success_msg: "Root login and password login are off."
