---
# Host requirements for CIS hardening
# https://docs.rke2.io/security/hardening_guide

- name: Create system user for etcd
  ansible.builtin.user:
    name: etcd
    shell: /sbin/nologin
    create_home: false
    system: true
  when:
    - rke2_type == 'server'

- name: Copy RKE2 CIS sysctl config file
  ansible.builtin.copy:
    remote_src: true
    src: /usr/local/share/rke2/rke2-cis-sysctl.conf
    dest: /etc/sysctl.d/60-rke2-cis.conf
    owner: root
    group: root
    mode: "0644"
  register: rke2_sysctl_config

# Not a handler: the CIS profile checks these values when RKE2 starts, which
# is before handlers would run.
- name: Restart systemd-sysctl # noqa: no-handler
  ansible.builtin.systemd_service:
    name: systemd-sysctl
    state: restarted
  when:
    - rke2_sysctl_config is changed
