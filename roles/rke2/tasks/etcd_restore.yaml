---
- name: Include preflight checks
  ansible.builtin.include_tasks: common_preflight.yaml

# The other servers join through the first one, so that's where the
# restored etcd has to be.
- name: Assert this is the first server
  ansible.builtin.assert:
    that:
      - inventory_hostname == rke2_first_server
    fail_msg: "Restore on {{ rke2_first_server }}, the first host in '{{ rke2_servers_group }}'."
    success_msg: "Restoring on the first server."

# The other servers mustn't run etcd. Two of three members still have
# quorum, so they would keep serving the old cluster next to the restored
# one, and the workers know all three.
- name: Check whether the other servers run etcd
  ansible.builtin.wait_for:
    host: "{{ hostvars[item].node_private_ip }}"
    port: 2379
    timeout: 3
  loop: "{{ rke2_servers | difference([inventory_hostname]) }}"
  register: rke2_other_etcd
  failed_when: false

- name: Assert no other server runs etcd
  ansible.builtin.assert:
    that:
      - rke2_etcd_running | length == 0
    fail_msg: >-
      etcd answers on {{ rke2_etcd_running | join(', ') }}. On each, stop
      rke2-server and delete {{ rke2_data_dir }}/server/db, or rebuild the
      server, then run the restore again.
    success_msg: "No other server runs etcd."
  vars:
    rke2_etcd_running: "{{ rke2_other_etcd.results | selectattr('state', 'defined') | map(attribute='item') | list }}"

- name: Assert rke2_etcd_snapshot_name is provided
  ansible.builtin.assert:
    that:
      - rke2_etcd_snapshot_name | length > 0
    fail_msg: "rke2_etcd_snapshot_name is required. Please provide it via extra vars (e.g., -e rke2_etcd_snapshot_name=<NAME>)."
    success_msg: "rke2_etcd_snapshot_name is defined."

- name: Confirm restore operation
  ansible.builtin.pause:
    prompt: >-
      WARNING: This will restore etcd from S3 snapshot '{{ rke2_etcd_snapshot_name }}'
      on host '{{ inventory_hostname }}' ({{ node_private_ip }}).
      Type 'restore' to proceed
  register: rke2_confirmation

- name: Assert user confirmation
  ansible.builtin.assert:
    that:
      - rke2_confirmation.user_input == "restore"
    fail_msg: "Restore aborted."
    success_msg: "Restore confirmed."

- name: Include config files
  ansible.builtin.include_tasks: common_config_files.yaml

- name: Check if RKE2 is installed
  ansible.builtin.stat:
    path: /usr/local/bin/rke2
  register: rke2_binary

- name: Include RKE2 install
  ansible.builtin.include_tasks: common_binary.yaml
  when: not rke2_binary.stat.exists

- name: Include CIS hardening
  ansible.builtin.include_tasks: common_cis_hardening.yaml

# Why we start RKE2 before restoring:
# rke2 server --cluster-reset needs to start the etcd static pod immediately
# after restoring the snapshot. On a fresh node, RKE2 must first extract its
# runtime binaries (~14s) and then import all container images into containerd
# (~30s). This delay causes the restore process to get stuck in an infinite
# "Failed to test etcd connection" loop, as etcd never starts in time.
#
# By starting RKE2 once before the restore, the runtime binaries are already
# extracted and all images are cached in containerd. When --cluster-reset runs
# later, etcd starts instantly.
- name: Start RKE2 server to extract binaries and images
  ansible.builtin.systemd_service:
    name: rke2-server
    state: started
    enabled: true
    daemon_reload: true

- name: Wait for API server to be ready before stopping
  ansible.builtin.wait_for:
    host: "{{ node_private_ip }}"
    port: 6443
    sleep: 10
    timeout: 300

- name: Stop RKE2 server service for restore
  ansible.builtin.systemd_service:
    name: rke2-server
    state: stopped
  failed_when: false

- name: Run etcd cluster-reset restore from S3 snapshot
  ansible.builtin.shell:
    cmd: >-
      rke2 server --cluster-reset
      --cluster-reset-restore-path={{ rke2_etcd_snapshot_name | quote }}
      > {{ rke2_etcd_restore_log }} 2>&1
  register: rke2_etcd_restore
  changed_when: true
  # Print the log before failing.
  failed_when: false
  when: not ansible_check_mode

- name: Read restore log
  ansible.builtin.command:
    cmd: cat {{ rke2_etcd_restore_log }}
  register: rke2_etcd_restore_output
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: Print restore log
  ansible.builtin.debug:
    msg: "{{ rke2_etcd_restore_output.stdout_lines }}"
  when: not ansible_check_mode

- name: Assert restore succeeded
  ansible.builtin.assert:
    that:
      - rke2_etcd_restore.rc == 0
    fail_msg: "Restore failed. The full log is in {{ rke2_etcd_restore_log }} on {{ inventory_hostname }}."
    success_msg: "Restore succeeded."
  when: not ansible_check_mode

- name: Start RKE2 service
  ansible.builtin.systemd_service:
    name: rke2-server
    state: started
    daemon_reload: true

- name: Wait for API server
  ansible.builtin.wait_for:
    host: "{{ node_private_ip }}"
    port: 6443
    sleep: 10
    timeout: 300

- name: Include node status
  ansible.builtin.include_tasks: common_node_status.yaml
