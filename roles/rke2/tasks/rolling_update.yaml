---
- name: Include preflight checks
  ansible.builtin.include_tasks: common_preflight.yaml

- name: Upgrade all packages
  ansible.builtin.apt:
    upgrade: dist
    update_cache: true

- name: Check if OS reports reboot required
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: rke2_os_reboot_file
  changed_when: rke2_os_reboot_file.stat.exists
  notify: Reboot required

- name: Include config files
  ansible.builtin.include_tasks: common_config_files.yaml

- name: Get current RKE2 version
  ansible.builtin.shell: |
    set -euo pipefail

    if systemctl is-active --quiet rke2-{{ rke2_type }} && rke2_service_pid=$(systemctl show rke2-{{ rke2_type }} --property MainPID --value); then
      rke2_bin_path="$(realpath "/proc/$rke2_service_pid/exe")"
    fi

    if [[ -f "${rke2_bin_path:=}" ]]; then
      current_version="$($rke2_bin_path --version | grep -E "rke2 version" | awk '{print $3}')"
    else
      current_version="none"
    fi

    echo "$current_version"
  args:
    executable: /bin/bash
  register: rke2_current_version
  changed_when: false

- name: Display current RKE2 version
  ansible.builtin.debug:
    msg: "{{ rke2_current_version.stdout }}{{ ' -> ' + rke2_version if rke2_current_version.stdout != rke2_version else '' }}"

- name: Update RKE2
  when: rke2_current_version.stdout != rke2_version
  block:
    - name: Include RKE2 install
      ansible.builtin.include_tasks: common_binary.yaml

    - name: Mark node for reboot
      ansible.builtin.set_fact:
        rke2_reboot_required: true

- name: Flush handlers
  ansible.builtin.meta: flush_handlers

- name: Maintenance
  when: rke2_reboot_required | default(false)
  block:
    - name: Drain node
      ansible.builtin.command:
        cmd: >-
          {{ rke2_bin_dir }}/kubectl --kubeconfig {{ rke2_kubeconfig }}
          drain {{ inventory_hostname }}
          --ignore-daemonsets
          --delete-emptydir-data
          --force
          --timeout={{ rke2_drain_timeout }}
      delegate_to: "{{ rke2_first_server }}"
      when: not ansible_check_mode
      register: rke2_drain
      until: rke2_drain.rc == 0
      retries: 3
      delay: 10
      changed_when: true
      # Reboot anyway: a pod that can't be evicted shouldn't block patching.
      failed_when: false

    - name: Warn when drain did not finish
      ansible.builtin.debug:
        msg: "Drain did not finish, rebooting anyway: {{ rke2_drain.stderr_lines | default([''], true) | last }}"
      when:
        - not ansible_check_mode
        - rke2_drain.rc != 0

    - name: Reboot
      ansible.builtin.reboot:
        reboot_timeout: 600

    - name: Include node status
      ansible.builtin.include_tasks: common_node_status.yaml

    - name: Uncordon node
      ansible.builtin.command:
        cmd: "{{ rke2_bin_dir }}/kubectl --kubeconfig {{ rke2_kubeconfig }} uncordon {{ inventory_hostname }}"
      delegate_to: "{{ rke2_first_server }}"
      when: not ansible_check_mode
      changed_when: true
