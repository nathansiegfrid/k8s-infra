---
# Entry points, picked with `tasks_from` in the playbooks:
#
#   install          set up nodes without RKE2 and join them to the cluster
#   rolling_update   config, OS and RKE2 upgrades, one node at a time (serial: 1)
#   uninstall        remove RKE2
#
# Without `tasks_from`, the role installs.

- name: Include install tasks
  ansible.builtin.include_tasks: install.yaml
