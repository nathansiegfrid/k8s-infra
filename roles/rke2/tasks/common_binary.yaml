---
# Install RKE2 at rke2_version with the official install script. Callers
# decide when: install.yaml and etcd_restore.yaml when RKE2 isn't installed,
# rolling_update.yaml when the running version differs.

# The script from the rke2_version tag, not get.rke2.io, which serves
# whatever is on master when the node installs.
- name: Download RKE2 install script
  ansible.builtin.get_url:
    url: "https://raw.githubusercontent.com/rancher/rke2/{{ rke2_version | urlencode }}/install.sh"
    dest: /var/tmp/rke2.sh
    mode: "0700"
    # Replace a script left by an earlier version.
    force: true

- name: Run RKE2 install script
  ansible.builtin.command:
    cmd: /var/tmp/rke2.sh
  environment:
    INSTALL_RKE2_VERSION: "{{ rke2_version }}"
    INSTALL_RKE2_TYPE: "{{ rke2_type }}"
  changed_when: true
  when: not ansible_check_mode
