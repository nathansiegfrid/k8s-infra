---
# Sets up nodes that don't run RKE2 yet, and leaves running nodes alone:
# config changes and upgrades go through rolling_update, which drains and
# reboots one node at a time.

- name: Include preflight checks
  ansible.builtin.include_tasks: common_preflight.yaml

- name: Check if RKE2 is installed
  ansible.builtin.stat:
    path: /usr/local/bin/rke2
  register: rke2_binary

- name: Set up a new node
  when: not rke2_binary.stat.exists
  block:
    - name: Include config files
      ansible.builtin.include_tasks: common_config_files.yaml

    - name: Include RKE2 install
      ansible.builtin.include_tasks: common_binary.yaml

    - name: Include CIS hardening
      ansible.builtin.include_tasks: common_cis_hardening.yaml

- name: Start RKE2 service on first master node
  ansible.builtin.systemd_service:
    name: rke2-server
    state: started
    enabled: true
    daemon_reload: true
  when: inventory_hostname == rke2_first_server

- name: Wait for API server on first master node
  ansible.builtin.wait_for:
    host: "{{ node_private_ip }}"
    port: 6443
    sleep: 10
    timeout: 300
  when: inventory_hostname == rke2_first_server

# etcd adds one new member at a time, as a learner, so the other servers
# join one by one. Starting rke2-server returns once the server is up.
- name: Start RKE2 service on remaining master nodes
  ansible.builtin.systemd_service:
    name: rke2-server
    state: started
    enabled: true
    daemon_reload: true
  when:
    - rke2_type == 'server'
    - inventory_hostname != rke2_first_server
  throttle: 1

- name: Wait for API server on remaining master nodes
  ansible.builtin.wait_for:
    host: "{{ node_private_ip }}"
    port: 6443
    sleep: 10
    timeout: 300
  when:
    - rke2_type == 'server'
    - inventory_hostname != rke2_first_server

- name: Start RKE2 service on worker nodes
  ansible.builtin.systemd_service:
    name: rke2-agent
    state: started
    enabled: true
    daemon_reload: true
  when: rke2_type == 'agent'

- name: Include node status
  ansible.builtin.include_tasks: common_node_status.yaml
