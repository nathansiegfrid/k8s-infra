---
# Hosts in this group run the RKE2 server (control plane and etcd). Every
# other host the role runs on is an agent.
rke2_servers_group: k8s_master_nodes
rke2_servers: "{{ groups[rke2_servers_group] }}"
rke2_type: "{{ 'server' if inventory_hostname in rke2_servers else 'agent' }}"

# The first server in the inventory bootstraps the cluster, and the other
# nodes join through it. etcd restores run on it too.
rke2_first_server: "{{ rke2_servers | first }}"

rke2_server_token: ""
# Agents join with their own token when it's set, so workers never hold the
# server token.
rke2_agent_token: ""

# See available versions in https://docs.rke2.io/release-notes/v1.34.X
rke2_version: v1.34.7+rke2r1
rke2_psa_enforce_version: "v1.34"

rke2_cni: none
rke2_ingress_controller: none
rke2_disable_kube_proxy: true
rke2_disable_components: []

# Must not overlap with the nodes' private IPs or cloud internal network.
rke2_cluster_cidr: 10.42.0.0/16
rke2_service_cidr: 10.43.0.0/16
rke2_cluster_dns: 10.43.0.10

rke2_config_dir: /etc/rancher/rke2
rke2_data_dir: /var/lib/rancher/rke2
rke2_bin_dir: /var/lib/rancher/rke2/bin
rke2_kubeconfig: /etc/rancher/rke2/rke2.yaml

rke2_etcd_s3: false
rke2_etcd_s3_bucket: ""
rke2_etcd_s3_region: ""
rke2_etcd_s3_endpoint: "s3.amazonaws.com"
rke2_etcd_s3_access_key: ""
rke2_etcd_s3_secret_key: ""
