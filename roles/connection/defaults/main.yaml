---
# Seconds to wait for each connection attempt.
connection_timeout: 10

# How each login is tried: plain ssh from this machine. It never prompts
# (BatchMode), and trusts a new host's key the way ansible.cfg does. A login
# that stalls after authentication fails after two unanswered keepalives,
# instead of hanging the run.
connection_ssh:
  - ssh
  - -o
  - BatchMode=yes
  - -o
  - ConnectTimeout={{ connection_timeout }}
  - -o
  - ServerAliveInterval=5
  - -o
  - ServerAliveCountMax=2
  - -o
  - StrictHostKeyChecking=accept-new
  - -p
  - "{{ hostvars[inventory_hostname].ansible_port | default(22) }}"

# With `tasks_from: mesh`, stop the run when this machine can't reach a node
# over WireGuard. Set to false to only list those nodes.
connection_mesh_required: true
