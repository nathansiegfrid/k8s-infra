---
# Prepare the OS for Kubernetes: hostname, time, packages, swap, kernel
# modules and sysctls.

- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

# Fix warning when using sudo on Debian after hostname change.
# sudo: unable to resolve host master-sg01: Name or service not known
- name: Update /etc/hosts with new hostname mapping
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1\s+'
    line: "127.0.1.1 localhost.localdomain {{ inventory_hostname }}"
    state: present

- name: Set timezone
  community.general.timezone:
    name: "{{ node_baseline_timezone }}"

- name: Check if RKE2 is installed
  ansible.builtin.stat:
    path: /usr/local/bin/rke2
  register: node_baseline_rke2

# Once RKE2 runs, OS upgrades go through upgrade.yaml, which drains the node
# before it reboots.
- name: Upgrade a new node before Kubernetes
  when: not node_baseline_rke2.stat.exists
  block:
    - name: Upgrade all packages
      ansible.builtin.apt:
        upgrade: dist
        update_cache: true

    - name: Check if OS reports reboot required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: node_baseline_reboot_file
      changed_when: node_baseline_reboot_file.stat.exists
      notify: Reboot

- name: Install cluster dependencies
  ansible.builtin.apt:
    name:
      - chrony # NTP time sync
      - nfs-common # NFS-based volumes
    state: present
    update_cache: true

- name: Enable and start chrony
  ansible.builtin.systemd_service:
    name: chrony
    state: started
    enabled: true

- name: Configure chrony (NTP)
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: /etc/chrony/chrony.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart chrony

# Kubernetes needs swap off. The kubelet will refuse to start otherwise.
- name: Disable swap for current session
  ansible.builtin.command: swapoff -a
  changed_when: true
  when:
    - ansible_facts['swaptotal_mb'] > 0
    - not ansible_check_mode

- name: Disable swap permanently (survives reboots)
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^(\s*)([^#\n]+\s+)(\w+\s+)swap(\s+.*)$'
    replace: '#\1\2\3swap\4'
    backup: true

- name: Load required kernel modules
  community.general.modprobe:
    name: "{{ item }}"
    state: present
    persistent: present
  loop:
    - br_netfilter
    - iptable_filter
    - iptable_mangle
    - iptable_nat
    - nf_conntrack
    - overlay

- name: Apply sysctl parameters for Kubernetes
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/99-kubernetes.conf
    state: present
    reload: true
  loop:
    - { key: "fs.inotify.max_user_instances", value: "8192" } # prevents "too many open files" for config watchers
    - { key: "fs.inotify.max_user_watches", value: "524288" } # prevents "too many open files" for config watchers
    - { key: "kernel.pid_max", value: "4194304" }
    - { key: "vm.swappiness", value: "0" }
