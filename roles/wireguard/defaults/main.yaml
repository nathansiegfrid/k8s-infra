---
wireguard_interface: wg0
wireguard_port: 51820
wireguard_mtu: 1420
wireguard_persistent_keepalive: 25
wireguard_dir: /etc/wireguard

# Machines outside the cluster that join the mesh, such as an admin's laptop:
# - name: laptop
#   public_key: "<from `wg pubkey`>"
#   allowed_ips: 10.0.0.100/32
#   private_key: "<optional: written into the client config>"
wireguard_extra_peers: []

# Where their client configs are written, on this machine.
wireguard_client_config_dir: "{{ playbook_dir }}/generated"
