---
# k8s-fleet, cloned fresh on this machine on every run, with this machine's
# own SSH access to GitHub, so the repository can be private. The bootstrap
# reads Cilium's and Flux Operator's definitions and the FluxInstance from
# the branch's latest commit, so Helm installs what Flux syncs and nothing
# here duplicates what Flux manages. The URL and branch must be the ones the
# FluxInstance syncs.
flux_bootstrap_fleet_url: ssh://git@github.com/nathansiegfrid/k8s-fleet.git
flux_bootstrap_fleet_branch: main
flux_bootstrap_cluster_dir: clusters/homelab

# Installed with Helm before Flux exists, in this order. Each is a directory
# under k8s-fleet's platform/, and Flux adopts the release once it syncs.
flux_bootstrap_components:
  - cilium # Flux needs a CNI to run
  - flux-operator

# The bootstrap runs on the first master, with RKE2's kubectl and admin
# kubeconfig.
flux_bootstrap_kubectl: /var/lib/rancher/rke2/bin/kubectl
flux_bootstrap_kubeconfig: /etc/rancher/rke2/rke2.yaml

# Helm on the first master, for the bootstrap only. The version Flux's
# helm-controller is built on (Flux 2.10: v4.3.1), so the releases Flux
# adopts were installed by the same Helm.
# https://github.com/helm/helm/releases
flux_bootstrap_helm_version: v4.3.1
flux_bootstrap_helm: /usr/local/bin/helm
flux_bootstrap_helm_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_facts['architecture']] }}"

# GitHub's SSH host keys, for Flux to verify github.com when it pulls
# k8s-fleet. Pinned in files/github_known_hosts rather than scanned at
# bootstrap, so a spoofed github.com can't hand Flux its own key. When
# GitHub rotates a key, copy the new lines from:
# https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/githubs-ssh-key-fingerprints
flux_bootstrap_known_hosts: "{{ lookup('ansible.builtin.file', 'github_known_hosts') }}"

# From secrets.sops.yaml:
#   flux_git_deploy_key  SSH private key with read access to k8s-fleet
#   flux_sops_age_key    the cluster's age private key, for k8s-fleet's secrets
