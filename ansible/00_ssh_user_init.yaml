---
# Each provider ships a different default user (root, ec2-user, ubuntu, etc.)
# This playbook creates a single consistent user across all nodes
# with SSH key auth and passwordless sudo.
#
# Set `ssh_default_user` per host in inventory.

- name: Create non-root superuser
  hosts: new_nodes
  gather_facts: false
  become: true

  vars:
    ansible_host: "{{ node_public_ip }}"
    ansible_user: "{{ ssh_default_user }}"

  tasks:
    - name: Create non-root user
      ansible.builtin.user:
        name: "{{ ssh_user }}"
        shell: /bin/bash
        groups: sudo

    - name: Authorize SSH public key
      ansible.posix.authorized_key:
        user: "{{ ssh_user }}"
        key: "{{ ssh_public_key }}"

    - name: Grant passwordless sudo
      ansible.builtin.copy:
        content: "{{ ssh_user }} ALL=(ALL) NOPASSWD:ALL\n"
        dest: "/etc/sudoers.d/{{ ssh_user }}"
        owner: root
        group: root
        mode: "0440"
        # Check syntax before writing.
        # Broken sudoers file can lock users out of the server.
        validate: visudo -cf %s
