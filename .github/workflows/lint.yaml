name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ansible:
    runs-on: ubuntu-latest
    env:
      # Lint without decrypting secrets.sops.yaml: CI has no age key.
      ANSIBLE_VARS_ENABLED: host_group_vars
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install ansible-lint and collections
        run: |
          pip install ansible-lint
          ansible-galaxy collection install -r requirements.yaml

      - name: Lint
        run: ansible-lint

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check every *.sops.yaml is encrypted
        run: |
          status=0
          for file in $(git ls-files '*.sops.yaml' ':!:.sops.yaml'); do
            if ! grep -q '^sops:' "$file" || ! grep -q 'ENC\[' "$file"; then
              echo "not encrypted: $file"
              status=1
            fi
          done
          exit "$status"
