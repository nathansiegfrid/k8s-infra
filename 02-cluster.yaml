---
# Part 2 of 2: Kubernetes on the nodes. Run 01-mesh.yaml first. Everything
# here connects over WireGuard, so the first play stops the run if this
# machine can't reach a node that way.
#
# Safe to re-run: it never upgrades, restarts or reboots a node that already
# runs RKE2. upgrade.yaml does that, one node at a time.

- name: Check this machine is on the mesh
  hosts: k8s_nodes
  gather_facts: false
  tasks:
    - name: Check each node over WireGuard
      ansible.builtin.import_role:
        name: connection
        tasks_from: mesh

- name: Prepare nodes for Kubernetes
  hosts: k8s_nodes
  become: true
  roles:
    - node_baseline

- name: Install RKE2
  hosts: k8s_nodes
  become: true
  tasks:
    - name: Install RKE2
      ansible.builtin.import_role:
        name: rke2
        tasks_from: install
