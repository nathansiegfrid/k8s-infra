---
# The provider's default user on a new VPS.
ssh_default_user: root

# The admin user created for every host, with sudo access.
# SSH is restricted to this user and accepts only this key.
# Password login disabled.
ssh_user: nathan
ssh_public_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBMtOVpcJxiub8T3iGkaoNxnJjjQdr2x4U7rhLYs/qMK nathan@siegfrid.com"

# Connect over WireGuard as the admin user, as every playbook after
# 01-mesh.yaml does. 01-mesh.yaml works out the right address and user for
# each host on every run instead (roles/connection).
ansible_host: "{{ node_private_ip | default(node_public_ip) }}"
ansible_user: "{{ ssh_user }}"

node_baseline_timezone: Asia/Jakarta
