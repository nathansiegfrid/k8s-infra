---
- name: Update RKE2 with rolling restart
  hosts: k8s_nodes
  become: true
  serial: 1

  vars:
    ansible_host: "{{ node_private_ip }}"
    ansible_user: "{{ ssh_user }}"

  tasks:
    - name: Update RKE2 with rolling restart
      ansible.builtin.import_role:
        name: rke2
        tasks_from: rolling_update
