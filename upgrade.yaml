---
# Apply RKE2 config changes, and upgrade the OS and RKE2, one node at a time
# in inventory order: masters first, then workers. A node is drained and
# rebooted only when something changed.

- name: Upgrade nodes one at a time
  hosts: k8s_nodes
  become: true
  serial: 1

  tasks:
    - name: Upgrade the node
      ansible.builtin.import_role:
        name: rke2
        tasks_from: rolling_update
