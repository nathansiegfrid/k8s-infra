apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tenants
  namespace: flux-system
spec:
  serviceAccountName: kustomize-controller
  interval: 10m

  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./clusters/cluster-02-rke2/tenants
  prune: true
  wait: true

  dependsOn:
    - name: platform
    - name: policies
