apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: main
  namespace: _
spec:
  interval: 5m
  url: https://github.com/nathansiegfrid/k8s-apps
  ref:
    branch: main

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: main
  namespace: _
spec:
  serviceAccountName: tenant-reconciler
  targetNamespace: _
  interval: 10m
  prune: true

  sourceRef:
    kind: GitRepository
    name: main
  path: .
