apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: istio
  namespace: flux-system
spec:
  serviceAccountName: kustomize-controller
  targetNamespace: istio-system
  interval: 10m
  timeout: 5m

  dependsOn:
    - name: cilium
    - name: gateway-api-crds

  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/istio
  prune: true
  wait: true
