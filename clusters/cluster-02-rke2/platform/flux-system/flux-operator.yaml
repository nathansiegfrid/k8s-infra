apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-operator
  namespace: flux-system
spec:
  serviceAccountName: kustomize-controller
  interval: 10m
  prune: true
  wait: true

  path: platform/flux-operator
  sourceRef:
    kind: GitRepository
    name: flux-system
