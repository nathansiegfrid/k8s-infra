apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-operator
  namespace: flux-system
spec:
  serviceAccountName: kustomize-controller
  interval: 10m
  timeout: 5m

  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/flux-operator
  prune: true
  wait: true
